spring.application.name=BMS-Clone

#Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

#JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
#JWT
jwt.secret=${JWT_SECRET}
jwt.refreshExpirationMs=86400000
jwt.accessExpirationMs=1800000

#Razorpay
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}

#brevo Smtp
brevo.api-key=${BREVO_API_KEY}
brevo.from-email=${BREVO_FROM_EMAIL}
brevo.from-name=BMS-Clone

app.email.mock-delivery=${APP_EMAIL_MOCK_DELIVERY:false}
app.frontend.base-url=https://bookmyshow-qlpj.onrender.com

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
